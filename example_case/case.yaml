schema: 1

species:
  - Aye
  - Bee
  - Cee

reactions:
  - aye_to_bee.autocatalytic
  - aye_plus_bee_to_cee.half_order

parameters:
  temperature: [200.0, 1500.0]
  pressure: [10000.0, 10000000.0]

domain:
  concentration_model: independent

  upper:
    default: 1000.0
    overrides:
      Aye: 100.0

  excursion_lower:
    default: -0.1

checks:
  profile: robust
  fail_fast: stage

report:
  verbosity: failures
  format: text
