[project]
name = "rxn-checker"
version = "0.1.0"
description = "Symbolic foundations for checking reaction-network robustness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.3",
    "sympy>=1.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "ruff>=0.16.6",
]

[project.scripts]
rxn-checker = "rxn_checker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rxn_checker"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
skip-magic-trailing-comma = true
