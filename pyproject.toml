[project]
name = "rxn-checker"
version = "0.1.0"
description = "Symbolic foundations for checking reaction-network robustness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.3",
    "sympy>=1.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
]

[project.scripts]
rxn-checker = "rxn_checker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rxn_checker"]
